// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        maven { url 'file:///tmp/local-maven-repo' }
        google()
        maven { url 'https://repo1.maven.org/maven2/' }
        mavenCentral()
        mavenLocal()
        maven { url 'https://jitpack.io' }
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.5.0"

        // ✅ REQUIRED for: plugins { id 'org.jetbrains.kotlin.android' }
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"

        classpath "org.lsposed.lsparanoid:gradle-plugin:0.5.2"
        classpath "com.github.CodingGay:BlackObfuscator-ASPlugin:3.9"
    }
}

allprojects {
    repositories {
        maven { url 'file:///tmp/local-maven-repo' }
        google()
        mavenCentral()
        mavenLocal()
        maven { url 'https://jitpack.io' }
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.9.20'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}