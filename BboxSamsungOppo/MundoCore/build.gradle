plugins {
    id 'com.android.library'
    id 'org.lsposed.lsparanoid'
    id 'org.jetbrains.kotlin.android'
}

android {

    compileSdkVersion 34
    buildToolsVersion = '34.0.0'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'proguard.txt'

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    
    buildTypes {
    
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
           path "src/main/cpp/Android.mk"
        }
    }
    
    dexOptions {
        preDexLibraries false
        maxProcessCount 8
        javaMaxHeapSize "4g"
    }
    
    compileOptions {
        encoding "UTF-8"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = "1.8"
    }

    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }

    buildFeatures {
        aidl true
        prefab true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        check 'NewApi', 'InlinedApi'
    }

    namespace "com.mundo"
    ndkVersion = '24.0.8215888'
    
    
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

// Annotation extraction requires lint toolchain deps not available offline;
// skip it since MundoCore is consumed as a project module, not a published AAR.
tasks.configureEach {
    if (name.startsWith('extract') && name.contains('Annotations')) {
        enabled = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    //implementation 'com.android.tools.build:apksig:4.2.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'  // A13+ hidden API bypass (replaces FreeReflection on A15/16)
    implementation 'com.github.tiann:FreeReflection:3.2.2'           // kept as legacy fallback
   // implementation project(":black-reflection")
   // annotationProcessor project(":black-reflection")
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.2'
    
    implementation "javax.annotation:javax.annotation-api:1.3.2"
}